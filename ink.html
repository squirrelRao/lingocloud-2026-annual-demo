function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function identity(kind='compact'){return '<div class="person person-'+kind+'"><img src="'+escapeHtml(person.avatar)+'" width="48" height="48" alt="'+escapeHtml(person.nickname)+'的头像"><div><strong>'+escapeHtml(person.nickname)+'</strong>'+(kind==='compact'?'':'<small>'+REPORT_TITLE+'</small>')+'</div></div>'}
function baseV18PageTop(n){return '<div class="page-top"><span>'+String(n+1).padStart(2,'0')+' / '+chapters[n][1]+'</span><span>2026</span></div>'+(n>0&&n<7?identity():'')}
function footer(n,nextText){return '<div class="page-footer"><button class="text-btn" data-prev>← '+(n===1?'相伴':'上一页')+'</button><button class="primary" data-next>'+nextText+icon('arrow')+'</button></div>'}
function getUsedModels(){if(!data.modelUsage)return null;return MODEL_CATALOG.map(m=>({...m,count:data.modelUsage[m.id]})).filter(m=>known(m.count)&&m.count>0).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'zh-CN'))}
